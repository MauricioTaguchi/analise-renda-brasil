name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-notebooks.txt
      - run: ruff check src tests
      - run: python -m pytest
      - name: Rebuild official artifacts
        run: python -m src.income_pipeline --input data/raw/ibge_sidra_6472.json
      - name: Execute legacy notebooks
        run: |
          python -m jupyter nbconvert --execute --to notebook --output-dir "$RUNNER_TEMP/executed-notebooks" notebooks/01_etl.ipynb
          python -m jupyter nbconvert --execute --to notebook --output-dir "$RUNNER_TEMP/executed-notebooks" notebooks/02_eda.ipynb
